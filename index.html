*{box-sizing:border-box;margin:0;padding:0}html,body{max-width:100%;overflow-x:hidden}body{font-family:'Poppins',system-ui,sans-serif;font-weight:500;background:var(--bg);color:var(--tx);font-size:14px;transition:background .4s}

function pList(){const p=S.p,R=S.u.role,rs=rows(p);let e=E[p];if(p==='appointments'){if(R==='Doctor')e={...e,show:{adate:'Date',atime:'Time',pn:'Patient',reason:'Reason',status:'Status',treatment:'Treatment',fee:'Fee Collected'}};else if(R==='Admin')e={...e,show:{...e.show,treatment:'Treatment',fee:'Fee'}}}

function pCal(){const f=new Date(S.m+'-01T00:00'),dn=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(),off=f.getDay(),by=calData();

 if(!hid)return o;
 const f=new Date(S.bm+'-01T00:00'),dn=new Date(f.getFullYear(),f.getMonth()+1,0).getDate(),off=f.getDay();

 for(let d=1;d<=dn;d++){const k=S.bm+'-'+String(d).padStart(2,'0'),past=k<TODAY(),hl=isHol(k,0),n=D.appointments.filter(a=>a.adate===k&&a.hospital_id==hid&&live(a)).length;

 o+='</div></div>';

 const c=cap(hid,dt);if(!c)return o+'<div class=card><p>No doctors available on this date. Please pick another day.</p></div>';

 for(let t=540;t<1020;t+=30){if(t>=780&&t<840)continue;const x=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'),tk=taken(hid,dt,x),off2=tk>=c||(dt===TODAY()&&x<=nowT);if(!off2)any=1;sl+=`<label class="slot${off2?' off':''}"><input type=radio name=tm value=${x} ${off2?'disabled':'required'}><span>${tfmt(x)}<small>${tk}/${c} booked</small></span></label>`}
 return o+`<form class=card onsubmit="book(event)"><h3>3⃣ Slots – ${dfmt(dt)} <small style="color:var(--mu);font-weight:500">· ${tot} patient(s) booked</small></h3><input type=hidden name=h value=${hid}><input type=hidden name=dt value="${h(dt)}"><div class=slots>${sl}</div>${any?`<div class=fld style="margin-top:14px"><label>Patient</label><select name=pid onchange="$('#np').style.display=this.value==='new'?'block':'none'">${D.patients.filter(p=>p.status==='Active').map(p=>`<option value=${p.id}>${h(p.name)} · ${h(p.phone||'')}</option>`).join('')}<option value=new>New patient</option></select></div><div id=np style="display:none"><div class=fld><input name=np_name placeholder="New patient name"></div><div class=fld><input name=np_phone placeholder="Mobile number"></div></div><div class=fld><label>Reason for visit</label><input name=reason placeholder="Tooth pain, cleaning..." required></div><button class=btn>Book Appointment</button>`:'<p style="margin-top:12px">No free slots on this date. Try another day.</p>'}</form>`}
